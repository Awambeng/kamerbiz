name: Feature request
description: Propose a user or business capability
title: "feat: "
labels: ["type: feature", "status: backlog"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem and when?
      placeholder: As a..., I need..., because...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, privacy and data considerations
      description: Mention tenant access, personal data, uploads, payments, abuse, or say "None identified".
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
    validations:
      required: false
