name: Bug report
description: Report incorrect or unexpected behavior
title: "fix: "
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Include versions and redacted logs. Never attach secrets or real customer data.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact and security implications
    validations:
      required: true
