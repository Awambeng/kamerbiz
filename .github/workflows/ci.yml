name: CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: apps/web
        run: npm install
      - name: Typecheck and build
        working-directory: apps/web
        run: npm run build
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kamerbiz
          POSTGRES_USER: kamerbiz
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kamerbiz -d kamerbiz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/kamerbiz
      DB_USERNAME: kamerbiz
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test and package
        working-directory: services/api
        run: mvn --batch-mode verify
