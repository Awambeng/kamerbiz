name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Check formatting
        working-directory: apps/web
        run: npm run format:check

      - name: Check Markdown
        working-directory: apps/web
        run: npm run markdown:check

      - name: Typecheck and build
        working-directory: apps/web
        run: npm run build

  backend:
    name: Backend formatting, tests, and package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-bookworm@sha256:34d1113892d0a0ad0a2f646972c3b7961062cbb8e01967735310379db9c39d72
        env:
          POSTGRES_DB: kamerbiz
          POSTGRES_USER: kamerbiz
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kamerbiz -d kamerbiz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/kamerbiz
      DB_USERNAME: kamerbiz
      DB_PASSWORD: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Format check, test, and package
        run: mvn --batch-mode --no-transfer-progress verify
