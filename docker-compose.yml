services:
  postgres:
    image: postgres:17.12-bookworm@sha256:34d1113892d0a0ad0a2f646972c3b7961062cbb8e01967735310379db9c39d72
    container_name: kamerbiz-postgres
    environment:
      POSTGRES_DB: kamerbiz
      POSTGRES_USER: kamerbiz
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - kamerbiz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamerbiz -d kamerbiz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - kamerbiz-object-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} && mc mb --ignore-existing local/kamerbiz-products && mc anonymous set download local/kamerbiz-products"
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: kamerbiz-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/keycloak/kamerbiz-realm.json:/opt/keycloak/data/import/kamerbiz-realm.json:ro
      - kamerbiz-keycloak-data:/opt/keycloak/data
    restart: unless-stopped
volumes:
  kamerbiz-postgres-data:
  kamerbiz-keycloak-data:
  kamerbiz-object-data:
