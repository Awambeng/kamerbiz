server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: kamerbiz-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/kamerbiz}
    username: ${DB_USERNAME:kamerbiz}
    password: ${DB_PASSWORD:local-only-change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    user:
      name: ${APP_BASIC_AUTH_USER:local}
      password: ${APP_BASIC_AUTH_PASSWORD:local-only-change-me}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
